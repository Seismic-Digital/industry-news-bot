name: Industry news bot

on:
  schedule:
    # Off-peak minutes: GitHub drops the most scheduled runs at :00 and :30.
    - cron: "7,37 * * * *"
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      sample_source:
        description: "Preview only: source name to post one sample from (e.g. PPC Land). Leave blank for a normal run."
        required: false
        default: ""

permissions:
  contents: write             # to commit state/state.json back to the repo

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, triage, post
        run: |
          if [ -n "$SAMPLE_SOURCE" ]; then python bot.py --sample "$SAMPLE_SOURCE"; else python bot.py; fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SAMPLE_SOURCE: ${{ inputs.sample_source }}
      - name: Save state
        if: always()
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "Update news bot state [skip ci]"
          git push
