name: Industry news bot

# GitHub's scheduler drops most runs, so instead one long run checks for news every
# 15 minutes for ~5.5 hours, then starts its own replacement. The schedule below is only a
# backup that restarts the chain if it ever breaks. (Free because the repo is public.)

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:          # "Run workflow" button: starts the loop, or posts one sample
    inputs:
      sample_source:
        description: "Preview only: source name to post one sample from (e.g. PPC Land). Leave blank to start the bot."
        required: false
        default: ""

permissions:
  contents: write             # commit state/state.json back to the repo
  actions: write              # start the next run in the chain

jobs:
  loop:
    if: ${{ !inputs.sample_source }}
    runs-on: ubuntu-latest
    timeout-minutes: 355      # GitHub's limit is 360
    # Only one loop at a time. A backup run that arrives while a loop is running waits,
    # and is dropped when the loop hands off to its successor.
    concurrency:
      group: newsbot-loop
      cancel-in-progress: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      LOOP_MINUTES: 330
      INTERVAL_MINUTES: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for news every 15 minutes
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          end=$((SECONDS + LOOP_MINUTES * 60))
          interval=$((INTERVAL_MINUTES * 60))
          failures=0
          while :; do
            # pick up any code or sources.yaml changes pushed since the last check
            git pull -q --rebase origin main || echo "::warning::git pull failed"
            python bot.py || { failures=$((failures + 1)); echo "::warning::bot run failed"; }
            git add state/state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Update news bot state [skip ci]"
              git pull -q --rebase origin main && git push -q || echo "::warning::state push failed"
            fi
            wait=$((interval - $(date +%s) % interval))   # line up with :00/:15/:30/:45
            [ $((SECONDS + wait)) -ge $end ] && break
            sleep "$wait"
          done
          echo "failures=$failures" >> "$GITHUB_ENV"
      - name: Start the next run
        if: ${{ !cancelled() }}   # cancelling a run stops the chain
        run: gh workflow run newsbot.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Report failures
        if: env.failures != '0'
        run: |
          echo "::error::$failures bot run(s) failed during this loop. See the log above."
          exit 1

  sample:
    if: ${{ inputs.sample_source }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py --sample "$SAMPLE_SOURCE"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SAMPLE_SOURCE: ${{ inputs.sample_source }}
