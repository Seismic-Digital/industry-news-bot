# Industry news bot configuration.
# To add a source: copy a block below, set its url and channels, commit. The first run
# after adding a source quietly marks its existing articles as seen, so it never floods.

settings:
  model: claude-opus-5-5        # switch to claude-haiku-5-5 to cut API cost ~95%
  timezone: America/Chicago
  max_item_age_hours: 48        # ignore feed items older than this
  min_score: 3                  # relevance 1-5; below this the item is dropped
  realtime_score: 4             # at/above this, post immediately (until the daily cap)
  breaking_score: 5             # at/above this, always post immediately, even past the cap
  daily_realtime_cap: 8         # max real-time posts per channel per day
  digest_hour: 16               # local hour for the daily "also worth a look" roundup
  digest_max_items: 10

# slack_channel must be the channel ID (right-click channel > View channel details > bottom of About tab).
channels:
  seo:
    slack_channel: "C0CATNKAAM7"
    focus: >-
      Organic search: Google and Bing algorithm and core updates, ranking volatility,
      Search Central documentation and policy changes, Search Console, technical SEO,
      local SEO and Google Business Profile, SERP feature changes, content and link strategy.
  paid_media:
    slack_channel: "C0CATNKAAM7"
    focus: >-
      Paid media: Google Ads, Microsoft Advertising, Meta, LinkedIn, TikTok, Amazon Ads,
      programmatic/DSPs (StackAdapt, CTV, display). New ad products and features, bidding,
      Performance Max, measurement and attribution, policy changes, audience and privacy changes.
  ai:
    slack_channel: "C0CATNKAAM7"
    focus: >-
      AI and AI search: major LLM and model releases (OpenAI, Anthropic, Google Gemini, Meta,
      Microsoft), Google AI Overviews and AI Mode, ChatGPT/Perplexity/Copilot search, and
      AEO/GEO/AI-visibility research - anything that changes how brands get found in AI answers.

# tier: primary = the platform itself, press = trade publications,
#       practitioner = expert blogs/tools, general = broad tech news (filtered hardest)
# type: rss (default) or scrape (for sites with no feed; needs link_pattern)
# If channels lists more than one, Claude routes each article to the best fit.
sources:
  # ---------- SEO ----------
  - {name: Google Search Central Blog, url: "https://developers.google.com/search/blog/feed.xml", tier: primary, channels: [seo, ai]}
  - {name: Google Search Status Dashboard, url: "https://status.search.google.com/en/feed.atom", tier: primary, channels: [seo]}
  - {name: Google Search Blog, url: "https://blog.google/products/search/rss/", tier: primary, channels: [seo, ai]}
  - {name: Bing Webmaster Blog, url: "https://blogs.bing.com/webmaster/feed", tier: primary, channels: [seo, ai]}
  # Search Engine Land's feed returned 403 in testing; if it's blocked, the bot falls back to
  # Google News (headlines only, so these summaries are lighter).
  - name: Search Engine Land
    url: "https://searchengineland.com/feed"
    fallback_url: "https://news.google.com/rss/search?q=site:searchengineland.com+when:2d&hl=en-US&gl=US&ceid=US:en"
    tier: press
    channels: [seo, paid_media, ai]
    strip_title_suffix: " - Search Engine Land"
  - {name: Search Engine Journal, url: "https://www.searchenginejournal.com/category/seo/feed/", tier: press, channels: [seo]}
  - {name: Search Engine Roundtable, url: "https://www.seroundtable.com/index.xml", tier: press, channels: [seo, paid_media, ai]}
  - {name: Moz, url: "https://moz.com/feeds/blog.rss", tier: practitioner, channels: [seo]}
  - {name: Ahrefs, url: "https://ahrefs.com/blog/feed/", tier: practitioner, channels: [seo, ai]}
  - {name: Semrush, url: "https://www.semrush.com/blog/feed/", tier: practitioner, channels: [seo, paid_media, ai]}
  - {name: Neil Patel, url: "https://neilpatel.com/blog/feed/", tier: practitioner, channels: [seo, paid_media, ai]}
  - {name: Growth Memo (Kevin Indig), url: "https://www.growth-memo.com/feed", tier: practitioner, channels: [seo, ai]}
  - {name: Marie Haynes, url: "https://www.mariehaynes.com/feed/", tier: practitioner, channels: [seo, ai]}
  - {name: GSQi (Glenn Gabe), url: "https://www.gsqi.com/marketing-blog/feed/", tier: practitioner, channels: [seo]}
  # Substack blocks GitHub's servers (403), so this falls back to Google News headlines.
  - name: Lily Ray
    url: "https://lilyraynyc.substack.com/feed"
    fallback_url: "https://news.google.com/rss/search?q=site:lilyraynyc.substack.com&hl=en-US&gl=US&ceid=US:en"
    tier: practitioner
    channels: [seo, ai]
    strip_title_suffix: " - Lily Ray | Substack"

  # ---------- Paid Media ----------
  - {name: Google Ads & Commerce Blog, url: "https://blog.google/products/ads-commerce/rss/", tier: primary, channels: [paid_media]}
  - {name: Microsoft Advertising Blog, url: "https://about.ads.microsoft.com/en/blog/rss", tier: primary, channels: [paid_media]}
  - {name: Meta for Business, url: "https://www.facebook.com/business/news/rss", tier: primary, channels: [paid_media]}
  - {name: StackAdapt, url: "https://www.stackadapt.com/main/feed", tier: primary, channels: [paid_media]}
  - {name: PPC Land, url: "https://ppc.land/rss/", tier: press, channels: [paid_media, seo, ai]}
  - {name: Search Engine Journal PPC, url: "https://www.searchenginejournal.com/category/paid-media/feed/", tier: press, channels: [paid_media]}
  - {name: Optmyzr, url: "https://www.optmyzr.com/blog/index.xml", tier: practitioner, channels: [paid_media]}
  - {name: WordStream, url: "https://www.wordstream.com/blog/feed", tier: practitioner, channels: [paid_media]}
  - {name: PPC Hero, url: "https://www.ppchero.com/feed/", tier: practitioner, channels: [paid_media]}

  # ---------- AI ----------
  - {name: OpenAI, url: "https://openai.com/news/rss.xml", tier: primary, channels: [ai]}
  - name: Anthropic
    url: "https://www.anthropic.com/news"
    type: scrape
    link_pattern: 'href="(/news/[a-z0-9-]+)"'
    tier: primary
    channels: [ai]
  - {name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", tier: primary, channels: [ai]}
  - {name: Google AI Blog, url: "https://blog.google/technology/ai/rss/", tier: primary, channels: [ai]}
  - {name: Google Gemini Blog, url: "https://blog.google/products/gemini/rss/", tier: primary, channels: [ai]}
  - {name: Microsoft Official Blog, url: "https://blogs.microsoft.com/feed/", tier: primary, channels: [ai]}
  - {name: Search Engine Journal AI, url: "https://www.searchenginejournal.com/category/generative-ai/feed/", tier: press, channels: [ai]}
  - {name: iPullRank, url: "https://ipullrank.com/feed", tier: practitioner, channels: [ai, seo]}
  - {name: SparkToro, url: "https://sparktoro.com/blog/feed/", tier: practitioner, channels: [ai, seo]}
  - {name: Simon Willison, url: "https://simonwillison.net/atom/everything/", tier: practitioner, channels: [ai]}
  - {name: The Verge AI, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", tier: general, channels: [ai]}
  - {name: TechCrunch AI, url: "https://techcrunch.com/category/artificial-intelligence/feed/", tier: general, channels: [ai]}
